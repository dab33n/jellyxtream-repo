<h1>Jellyxtream</h1>
<p>Jellyfin-Plugin für Xtream-kompatible IPTV-Anbieter (Jellyfin 10.11.x).</p>
<p>In Jellyfin unter <b>Dashboard → Plugins → Repositories → +</b> eintragen:</p>
<p><code id="url">manifest.json</code></p>
<p>Danach unter <b>Katalog</b> „Jellyxtream“ installieren und Jellyfin neu starten.</p>
<script>document.getElementById('url').textContent = new URL('manifest.json', location.href).href;</script>
